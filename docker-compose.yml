services:
  postgres:
    image: postgres:18-alpine
    container_name: itsphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: itsphere
      POSTGRES_PASSWORD: itsphere
      POSTGRES_DB: itsphere
    ports:
      - '${POSTGRES_PORT:-5454}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U itsphere -d itsphere']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
